<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scaffold reference: comp-a.png</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=MuseoModerno:wght@700&family=Commissioner:wght@700&display=swap">
  <link rel="stylesheet" href="layout.css">
  <style>html,body{margin:0}body{background:#171819}.region{box-sizing:border-box}.region.text p{white-space:pre-wrap}</style>
</head>
<body>
<!-- Reference only. Every region sits at its measured box inside a comp-aspect frame. Take the boxes (layout.css), keep your own semantic structure. -->
<main class="comp-frame" style="max-width:2048px">
  <div class="r-logo region text" data-region="logo"><!-- LAITH MIMI wordmark, white bold uppercase, top left --><p style="font-size:var(--r-logo-font);line-height:1.05;margin:0">logo</p></div>
  <div class="r-nav-links region control" data-region="nav-links"><!-- nav links Skills Work Services Experience Contact, white: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop nav-links); a control need not have button chrome --></div>
  <div class="r-nav-cta region control" data-region="nav-cta"><!-- mint pill button Start Project with arrow, dark text: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop nav-cta); a control need not have button chrome --></div>
  <div class="r-greeting region text" data-region="greeting"><!-- Hey, I'm a Software Engineer & AI Developer, white bold --><p style="font-size:var(--r-greeting-font);font-family:var(--r-greeting-family),sans-serif;font-weight:var(--r-greeting-weight);line-height:1.05;margin:0">greeting</p></div>
  <div class="r-name region text" data-region="name"><!-- LAITH MIMI giant mint uppercase display slab, the h1 --><p style="line-height:1.05;margin:0">name</p></div>
  <div class="r-glow region chrome" data-region="glow"><!-- soft radial mint glow behind the portrait --></div>
  <figure class="r-portrait region plate" data-region="portrait"><img src="../../../assets/plates/portrait.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:center"></figure>
  <div class="r-intro region text" data-region="intro"><!-- intro paragraph, white, right column --><p style="font-size:var(--r-intro-font);line-height:1.05;margin:0">intro</p></div>
  <div class="r-scroll region chrome" data-region="scroll"><!-- vertical SCROLL label with thin mint rule on the right edge --></div>
  <div class="r-email region text" data-region="email"><!-- E Laithmimi03@gmail.com contact row --><p style="font-size:var(--r-email-font);line-height:1.05;margin:0">email</p></div>
  <div class="r-phone region text" data-region="phone"><!-- T 054-3600249 contact row --><p style="font-size:var(--r-phone-font);line-height:1.05;margin:0">phone</p></div>
  <div class="r-socials region control" data-region="socials"><!-- slash social links / LinkedIn / GitHub, mint slashes: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop socials); a control need not have button chrome --></div>
  <div class="r-ticker region text" data-region="ticker"><!-- grey LAITH MIMI repeated ticker band at the bottom --><p style="font-size:var(--r-ticker-font);font-family:var(--r-ticker-family),sans-serif;font-weight:var(--r-ticker-weight);line-height:1.05;margin:0">ticker</p></div>
</main>
</body>
</html>
